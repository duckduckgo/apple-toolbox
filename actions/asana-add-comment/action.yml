name: Add comment on Asana task
description: |
  Posts a comment (story) on an Asana task. The author of the comment is the
  Asana user whose access token is provided.
inputs:
  access-token:
    description: "Asana access token. The token owner becomes the comment author."
    required: true
    type: string
  task-id:
    description: "Asana task gid to comment on (any task or subtask)."
    required: true
    type: string
  comment:
    description: "The comment text to post."
    required: true
    type: string
runs:
  using: "composite"
  steps:
      - name: "Post comment to Asana task"
        shell: bash
        # Inputs via env (not positional args) — `comment` is free-form text;
        # positional would re-parse it through the shell and risk injection
        # via backticks, $(), or unescaped quotes.
        env:
          ASANA_ACCESS_TOKEN: ${{ inputs.access-token }}
          TASK_ID: ${{ inputs.task-id }}
          COMMENT: ${{ inputs.comment }}
        run: |
          ${{ github.action_path }}/asana-add-comment.sh
