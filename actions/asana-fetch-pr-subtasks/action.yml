name: Fetch Asana PR review subtasks
description: |
  Fetches PR review subtasks of an Asana parent task. Results can be
  filtered by completion state and, optionally, by the GitHub reviewer
  they're assigned to. By default no filtering is applied.
inputs:
  access-token:
    description: "Asana access token"
    required: true
    type: string
  asana-task-id:
    description: "Parent Asana task gid whose PR review subtasks to fetch"
    required: true
    type: string
  github-reviewer-user:
    description: "Optional GitHub username. If provided, filter to subtasks assigned to this reviewer. If empty, return all PR review subtasks."
    required: false
    type: string
    default: ''
  github-token:
    description: "GitHub token. Required only when github-reviewer-user is set (used to resolve the user's Asana gid)."
    required: false
    type: string
  complete:
    description: "Filter PR subtasks by completion state. '' (default) disables the filter and returns subtasks in any state; 'false' returns only incomplete subtasks; 'true' returns only completed subtasks."
    required: false
    type: string
    default: ''
outputs:
  subtask-ids:
    description: "JSON array of matching subtask gids. Empty array if none found."
    value: ${{ steps.fetch-pr-subtasks.outputs.subtask-ids }}
runs:
  using: "composite"
  steps:
      - name: Get reviewer Asana user ID
        id: get-asana-user-id
        if: inputs.github-reviewer-user != ''
        uses: duckduckgo/native-github-asana-sync@v1.9
        with:
          action: 'get-asana-user-id'
          github-username: ${{ inputs.github-reviewer-user }}
          github-pat: ${{ inputs.github-token }}

      - name: "Fetch PR subtasks"
        id: fetch-pr-subtasks
        shell: bash
        env:
          ASANA_ACCESS_TOKEN: ${{ inputs.access-token }}
          PARENT_TASK_ID: ${{ inputs.asana-task-id }}
          REVIEWER_USER: ${{ inputs.github-reviewer-user }}
          ASSIGNEE_FILTER: ${{ steps.get-asana-user-id.outputs.asanaUserId }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMPLETE: ${{ inputs.complete }}
        run: |
          ${{ github.action_path }}/asana-fetch-pr-subtasks.sh
